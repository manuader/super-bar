name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | tail -1)"
      - name: Kit tests
        run: swift test --package-path Packages/SuperBarKit
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app (unsigned)
        run: |
          xcodebuild -project SuperBar.xcodeproj -scheme SuperBar -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= \
            build | tail -20
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: SuperBar.app
          path: build/DerivedData/Build/Products/Release/SuperBar.app
